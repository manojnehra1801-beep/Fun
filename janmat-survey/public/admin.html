<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Admin Login | Rajasthan Govt Vacancies</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Arial,
        "Noto Sans Devanagari",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef2ff,
          #f8fafc
        );

      color: #172033;
    }

    .login-card {
      width: 100%;
      max-width: 410px;

      background: white;

      padding: 32px 25px;

      border-radius: 22px;

      box-shadow:
        0 20px 50px
        rgba(15, 23, 42, .10);

      border:
        1px solid #e8ebf2;
    }

    .logo {
      width: 65px;
      height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 15px;

      border-radius: 18px;

      background: #eef2ff;

      font-size: 31px;
    }

    h1 {
      text-align: center;

      margin: 0;

      font-size: 25px;

      color: #172554;
    }

    .subtitle {
      text-align: center;

      color: #64748b;

      font-size: 13px;

      margin:
        8px 0 27px;
    }

    .group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 14px;

      border:
        1px solid #d8deea;

      border-radius: 11px;

      outline: none;

      font-size: 14px;

      background: white;
    }

    input:focus {
      border-color: #3155d9;

      box-shadow:
        0 0 0 3px #eef2ff;
    }

    .login-btn {
      width: 100%;

      border: none;

      border-radius: 11px;

      padding: 14px;

      background: #3155d9;

      color: white;

      font-size: 15px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 5px;
    }

    .login-btn:disabled {
      opacity: .65;

      cursor: wait;
    }

    .error {
      display: none;

      margin-top: 15px;

      padding: 11px;

      border-radius: 9px;

      background: #fff1f2;

      color: #be123c;

      font-size: 12px;

      text-align: center;
    }

    .success {
      display: none;

      margin-top: 15px;

      padding: 11px;

      border-radius: 9px;

      background: #ecfdf5;

      color: #047857;

      font-size: 12px;

      text-align: center;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #64748b;

      text-decoration: none;

      font-size: 12px;
    }

    .security {
      text-align: center;

      margin-top: 20px;

      color: #94a3b8;

      font-size: 10px;
    }

  </style>

</head>


<body>


<div class="login-card">


  <div class="logo">
    🔐
  </div>


  <h1>
    Admin Panel
  </h1>


  <div class="subtitle">
    Rajasthan Govt Vacancies Administration
  </div>


  <form id="loginForm">


    <div class="group">

      <label for="adminId">
        Admin ID
      </label>

      <input
        type="text"
        id="adminId"
        placeholder="Enter Admin ID"
        autocomplete="username"
        required>

    </div>


    <div class="group">

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter Password"
        autocomplete="current-password"
        required>

    </div>


    <button
      type="submit"
      class="login-btn"
      id="loginBtn">

      Login to Dashboard →

    </button>


    <div
      class="error"
      id="error">
    </div>


    <div
      class="success"
      id="success">

      Login successful. Opening dashboard...

    </div>


  </form>


  <a
    href="/"
    class="back">

    ← Back to Website

  </a>


  <div class="security">

    🔒 Authorized access only

  </div>


</div>



<script>


// ==================================================
// BACKEND API
// ==================================================

const API_URL =
  "https://rajasthangovtvacancie.onrender.com";


// ==================================================
// ELEMENTS
// ==================================================

const form =
  document.getElementById(
    "loginForm"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const errorBox =
  document.getElementById(
    "error"
  );

const successBox =
  document.getElementById(
    "success"
  );


// ==================================================
// LOGIN
// ==================================================

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    errorBox.style.display =
      "none";

    successBox.style.display =
      "none";


    const id =
      document
        .getElementById("adminId")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    if (!id || !password) {

      errorBox.textContent =
        "Admin ID और Password दोनों भरें।";

      errorBox.style.display =
        "block";

      return;

    }


    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "Checking...";


    try {


      const response =
        await fetch(
          API_URL +
          "/api/admin/login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              id: id,
              password: password
            })
          }
        );


      let result;


      try {

        result =
          await response.json();

      } catch (e) {

        result = {
          success: false,
          message:
            "Server returned an invalid response."
        };

      }


      console.log(
        "Login response:",
        result
      );


      // ==========================================
      // SUCCESS
      // ==========================================

      if (
        response.ok &&
        result.success === true
      ) {


        // Save login on SAME domain

        sessionStorage.setItem(
          "janmatAdminLoggedIn",
          "true"
        );


        sessionStorage.setItem(
          "adminLoginTime",
          Date.now().toString()
        );


        successBox.textContent =
          "✅ Login successful. Opening dashboard...";

        successBox.style.display =
          "block";


        loginBtn.textContent =
          "Login Successful ✓";


        /*
          IMPORTANT:
          Use relative URL.

          This keeps the user on the same
          Static Site domain, so sessionStorage
          remains available.
        */

        setTimeout(
          function() {

            window.location.assign(
              "./admin-dashboard.html"
            );

          },
          500
        );


        return;

      }


      // ==========================================
      // WRONG LOGIN
      // ==========================================

      errorBox.textContent =
        result.message ||
        "Invalid Admin ID or Password.";

      errorBox.style.display =
        "block";


    } catch (error) {


      console.error(
        "Login error:",
        error
      );


      errorBox.textContent =
        "Server connection failed.";

      errorBox.style.display =
        "block";

    }


    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "Login to Dashboard →";

  }
);


// ==================================================
// ENTER KEY
// ==================================================

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        form.requestSubmit();

      }

    }
  );


</script>


</body>

</html>
