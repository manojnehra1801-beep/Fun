<script>

  const form =
    document.getElementById("candidateForm");

  const successMessage =
    document.getElementById("successMessage");


  form.addEventListener("submit", async function(event) {

    event.preventDefault();


    /* GET FORM VALUES */

    const state =
      document.getElementById("state").value;

    const district =
      document.getElementById("district").value.trim();

    const village =
      document.getElementById("village").value.trim();

    const panchayat =
      document.getElementById("panchayat").value.trim();

    const candidate1 =
      document.getElementById("candidate1").value.trim();

    const candidate2 =
      document.getElementById("candidate2").value.trim();

    const candidate3 =
      document.getElementById("candidate3").value.trim();

    const candidate4 =
      document.getElementById("candidate4").value.trim();

    const mobile =
      document.getElementById("mobile").value.trim();

    const extraInfo =
      document.getElementById("extraInfo").value.trim();

    const likely =
      document.querySelector(
        'input[name="likely"]:checked'
      );


    /* REQUIRED CHECK */

    if (
      !state ||
      !district ||
      !village ||
      !panchayat ||
      !candidate1 ||
      !likely
    ) {

      alert(
        "कृपया सभी जरूरी जानकारी भरें।"
      );

      return;
    }


    /* MOBILE CHECK */

    if (
      mobile &&
      !/^[0-9]{10}$/.test(mobile)
    ) {

      alert(
        "कृपया सही 10 digit mobile number डालें।"
      );

      return;
    }


    /* BUTTON */

    const submitButton =
      document.querySelector(".submit-btn");

    submitButton.disabled = true;

    submitButton.textContent =
      "Submitting...";


    /* DATA */

    const candidateData = {

      state: state,

      district: district,

      village: village,

      panchayat: panchayat,

      candidate1: candidate1,

      candidate2: candidate2 || null,

      candidate3: candidate3 || null,

      candidate4: candidate4 || null,

      mobile: mobile || null,

      likely: likely.value,

      extraInfo: extraInfo || null

    };


    try {

      /* SEND TO SERVER */

      const response =
        await fetch(
          "/api/candidates",
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json"

            },

            body:
              JSON.stringify(
                candidateData
              )

          }
        );


      const result =
        await response.json();


      /* ERROR */

      if (!response.ok) {

        console.error(result);

        alert(
          result.message ||
          "Something went wrong."
        );

        submitButton.disabled = false;

        submitButton.textContent =
          "जानकारी Submit करें →";

        return;
      }


      /* SUCCESS */

      form.style.display =
        "none";

      successMessage.style.display =
        "block";


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });


    } catch (error) {

      console.error(error);

      alert(
        "Server से connection नहीं हो पाया।"
      );


      submitButton.disabled = false;

      submitButton.textContent =
        "जानकारी Submit करें →";

    }

  });

</script>
