<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Take Survey | Janmat Survey</title>

  <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo">
      🗳️ Janmat Survey
    </div>

    <nav>

      <a href="index.html">
        Home
      </a>

      <a href="results.html">
        Results
      </a>

    </nav>

  </header>


  <!-- SURVEY -->

  <main>

    <div class="form-container">

      <div class="form-card">

        <div class="badge">
          📝 PUBLIC OPINION SURVEY
        </div>

        <h1>
          Apni Rai Dein
        </h1>

        <p>
          Survey complete karne mein lagbhag
          2–3 minutes lagenge.
        </p>


        <form id="surveyForm">


          <!-- AGE -->

          <div class="form-group">

            <label for="ageGroup">
              Age Group *
            </label>

            <select
              id="ageGroup"
              required>

              <option value="">
                Select age group
              </option>

              <option value="18-25">
                18–25
              </option>

              <option value="26-35">
                26–35
              </option>

              <option value="36-45">
                36–45
              </option>

              <option value="46-60">
                46–60
              </option>

              <option value="60+">
                60+
              </option>

            </select>

          </div>


          <!-- GENDER -->

          <div class="form-group">

            <label for="gender">
              Gender
            </label>

            <select id="gender">

              <option value="Prefer not to say">
                Prefer not to say
              </option>

              <option value="Male">
                Male
              </option>

              <option value="Female">
                Female
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <!-- STATE -->

          <div class="form-group">

            <label for="state">
              State *
            </label>

            <input
              type="text"
              id="state"
              placeholder="Example: Rajasthan"
              required>

          </div>


          <!-- DISTRICT -->

          <div class="form-group">

            <label for="district">
              District *
            </label>

            <input
              type="text"
              id="district"
              placeholder="Example: Jhunjhunu"
              required>

          </div>


          <!-- CONSTITUENCY -->

          <div class="form-group">

            <label for="constituency">
              Constituency *
            </label>

            <input
              type="text"
              id="constituency"
              placeholder="Enter constituency"
              required>

          </div>


          <!-- AREA -->

          <div class="form-group">

            <label for="area">
              Village / Ward / Area
            </label>

            <input
              type="text"
              id="area"
              placeholder="Optional">

          </div>


          <!-- ISSUE -->

          <div class="form-group">

            <label for="importantIssue">
              Sabse Important Issue *
            </label>

            <select
              id="importantIssue"
              required>

              <option value="">
                Select an issue
              </option>

              <option value="Employment">
                Employment / Jobs
              </option>

              <option value="Education">
                Education
              </option>

              <option value="Healthcare">
                Healthcare
              </option>

              <option value="Roads & Infrastructure">
                Roads & Infrastructure
              </option>

              <option value="Agriculture">
                Agriculture
              </option>

              <option value="Water">
                Water
              </option>

              <option value="Electricity">
                Electricity
              </option>

              <option value="Law & Order">
                Law & Order
              </option>

              <option value="Other">
                Other
              </option>

            </select>

          </div>


          <!-- PARTY -->

          <div class="form-group">

            <label for="preferredParty">
              Preferred Party *
            </label>

            <select
              id="preferredParty"
              required>

              <option value="">
                Select party
              </option>

              <option value="Party A">
                Party A
              </option>

              <option value="Party B">
                Party B
              </option>

              <option value="Party C">
                Party C
              </option>

              <option value="Independent">
                Independent
              </option>

              <option value="Undecided">
                Undecided
              </option>

            </select>

          </div>


          <!-- CANDIDATE -->

          <div class="form-group">

            <label for="candidateChoice">
              Preferred Candidate *
            </label>

            <input
              type="text"
              id="candidateChoice"
              placeholder="Candidate name / Undecided"
              required>

          </div>


          <!-- VOTING INTENTION -->

          <div class="form-group">

            <label for="votingLikelihood">
              Vote dene ki possibility *
            </label>

            <select
              id="votingLikelihood"
              required>

              <option value="">
                Select
              </option>

              <option value="Very likely">
                Very likely
              </option>

              <option value="Likely">
                Likely
              </option>

              <option value="Not sure">
                Not sure
              </option>

              <option value="Unlikely">
                Unlikely
              </option>

            </select>

          </div>


          <!-- CONSENT -->

          <div class="form-group">

            <label
              style="
              display:flex;
              gap:10px;
              align-items:flex-start;
              font-weight:normal;
              ">

              <input
                type="checkbox"
                id="consent"
                required
                style="width:auto;margin-top:5px;">

              <span>
                I understand that this is an independent
                public opinion survey and my response may
                be included in aggregated statistics.
              </span>

            </label>

          </div>


          <!-- SUBMIT -->

          <button
            type="submit"
            class="submit-btn"
            id="submitBtn">

            Submit Survey

          </button>


        </form>

      </div>

    </div>

  </main>


  <!-- FOOTER -->

  <footer>

    <div class="footer-logo">
      🗳️ Janmat Survey
    </div>

    <p>
      Independent public opinion survey platform.
    </p>

    <p class="disclaimer">
      This website is not an official government
      or Election Commission website.
    </p>

  </footer>


  <script src="js/survey.js"></script>

</body>

</html>
