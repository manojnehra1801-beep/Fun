<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Survey Results</title>

<link rel="stylesheet"
href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

Janmat Survey
</div>
