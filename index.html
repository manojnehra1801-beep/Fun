<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Someone Special ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    overflow:hidden;
}

.container{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
    max-width:500px;
}

h1{
    color:#ff2d55;
    margin-bottom:15px;
}

p{
    color:#444;
    margin-bottom:25px;
    font-size:18px;
}

button{
    padding:12px 28px;
    font-size:18px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    margin:10px;
}

#yes{
    background:#ff2d55;
    color:white;
}

#no{
    background:#ddd;
}

#message{
    display:none;
    margin-top:25px;
    color:#ff2d55;
    font-size:24px;
    font-weight:bold;
}

.heart{
    position:fixed;
    color:red;
    animation:fall 5s linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100px);
    }
    to{
        transform:translateY(110vh);
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>❤️ Hey Beautiful ❤️</h1>

    <p>
        Every moment with you feels special.<br><br>
        I'd love to spend some time with you...
    </p>

    <h2>Will you go for a Coffee ☕ and a Date 🌹 with me?</h2>

    <br>

    <button id="yes">YES ❤️</button>
    <button id="no">NO 🙈</button>

    <div id="message">
        Yay!! ❤️<br><br>
        I can't wait to see you. ☕🌹
    </div>
</div>

<script>
const yes=document.getElementById("yes");
const no=document.getElementById("no");
const msg=document.getElementById("message");

yes.onclick=()=>{
    msg.style.display="block";
    createHearts();
}

no.onmouseover=()=>{
    no.style.position="absolute";
    no.style.left=Math.random()*80+"%";
    no.style.top=Math.random()*80+"%";
}

function createHearts(){
    setInterval(()=>{
        const heart=document.createElement("div");
        heart.innerHTML="❤️";
        heart.className="heart";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(20+Math.random()*30)+"px";
        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },5000);
    },200);
}
</script>

</body>
</html>
